name: CI

on:
  pull_request:
    branches:
      - '**'
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  spotless_autofix:
    name: Spotless (auto-fix)
    runs-on: ubuntu-22.04
    container: wpilib/roborio-cross-ubuntu:2026-22.04-py314
    permissions:
      contents: write

    steps:
      - name: Checkout PR branch (NOT detached)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.CI_BOT_TOKEN }}
          fetch-depth: 0
          persist-credentials: true


      # Avoid "dubious ownership" errors inside container
      - name: Add repository to git safe directories
        run: git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Run Spotless without triggering createVersionFile
      - name: Run Spotless (skip createVersionFile)
        run: ./gradlew --no-daemon spotlessApply -x createVersionFile

      # Auto-push only for same-repo PRs (forks have no permission)
      - name: Commit and push formatting changes
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: apply Spotless"
          file_pattern: "src/**/*.java"

      # Fail if changes remain (e.g. fork PRs)
      - name: Fail if formatting changes remain
        run: git --no-pager diff --exit-code

  build:
    name: Build (compile)
    needs: spotless_autofix
    runs-on: ubuntu-22.04
    container: wpilib/roborio-cross-ubuntu:2026-22.04-py314

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Add repository to git safe directories
        run: git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Compile without Spotless or createVersionFile to keep CI clean
      - name: Compile (and tests if enabled)
        run: ./gradlew --no-daemon build -x spotlessApply -x createVersionFile
